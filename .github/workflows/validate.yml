name: Prüfen

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Einmal die Woche: Home Assistant, hassfest und HACS ändern ihre Regeln,
    # ohne dass sich hier etwas ändert. Ein Fehlschlag soll auffallen, bevor
    # jemand installiert.
    - cron: "0 5 * * 2"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Alle Tests
        run: |
          for datei in tests/test_*.py; do
            echo "== $datei"
            python3 "$datei"
          done

  importe:
    name: Import gegen aktuelles Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.9 verlangt >= 3.14.2.
          python-version: "3.14"
      - name: Home Assistant installieren
        run: pip install --prefer-binary homeassistant
      - name: Jedes Modul der Integration importieren
        # Genau der Test, der gefehlt hat: Er zieht das echte Home Assistant
        # und führt die Importe aus. Wird ein Name in einer neuen Fassung
        # umbenannt oder entfernt, fällt es hier auf - und nicht erst bei
        # jemandem, der gerade aktualisiert hat.
        run: |
          python - <<'PY'
          import importlib, logging, pathlib, sys, warnings

          sys.path.insert(0, str(pathlib.Path("custom_components").resolve()))
          from homeassistant.const import __version__ as ha_version

          print(f"Home Assistant {ha_version}")

          # Veraltete Schnittstellen funktionieren noch - der Import allein
          # fällt also nicht auf. Home Assistant meldet sie entweder als
          # DeprecationWarning oder über das Protokoll. Beides wird hier
          # eingesammelt und macht den Lauf rot, solange es uns betrifft.
          #
          # Nicht vollständig: Manche Hinweise kommen erst zur Laufzeit, wenn
          # die Funktion tatsächlich aufgerufen wird. Der Importpfad deckt ab,
          # was beim Laden der Module auffällt.
          protokoll: list[str] = []

          class Sammler(logging.Handler):
              def emit(self, satz: logging.LogRecord) -> None:
                  text = satz.getMessage()
                  if "deprecat" in text.lower() or "veraltet" in text.lower():
                      protokoll.append(f"{satz.name}: {text}")

          logging.getLogger().addHandler(Sammler())
          logging.getLogger().setLevel(logging.DEBUG)

          with warnings.catch_warnings(record=True) as gesammelt:
              warnings.simplefilter("always")
              for name in (
                  "fluessiggas",
                  "fluessiggas.const",
                  "fluessiggas.units",
                  "fluessiggas.history",
                  "fluessiggas.forecast",
                  "fluessiggas.coordinator",
                  "fluessiggas.config_flow",
                  "fluessiggas.sensor",
                  "fluessiggas.number",
              ):
                  importlib.import_module(name)
                  print(f"  ok  {name}")

          for warnung in gesammelt:
              if not issubclass(warnung.category, DeprecationWarning):
                  continue
              # Nur was aus unseren eigenen Dateien gemeldet wird - fremde
              # Bibliotheken sollen den Lauf nicht rot machen.
              if "fluessiggas" in str(warnung.filename):
                  protokoll.append(f"{warnung.filename}:{warnung.lineno}: {warnung.message}")

          if protokoll:
              print("\nVeraltete Schnittstellen:")
              for zeile in protokoll:
                  print(f"  {zeile}")
              sys.exit(1)
          print("\nKeine veralteten Schnittstellen gemeldet.")
          PY

  karte:
    name: Karte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax der Lovelace-Karte
        run: node --check custom_components/fluessiggas/frontend/lpg-tank-card.js
