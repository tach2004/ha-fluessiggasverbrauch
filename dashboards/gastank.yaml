################################################################################
#  Beispiel-Dashboard "Gastank"
#
#  Einbinden: Dashboard → Bearbeiten → ⋮ → "Rohkonfigurationseditor",
#             Inhalt ab "views:" übernehmen.
#
#  Die Entity-IDs unten gelten für einen Tank namens "Flüssiggastank".
#  Heißt dein Tank anders, ersetze überall den Teil "flussiggastank"
#  (Home Assistant macht aus "ü" ein "u"). Die Karte selbst braucht keine
#  Entity-IDs – sie findet den Tank von allein.
################################################################################
views:
  # ===========================================================================
  - title: Gastank
    path: gastank
    icon: mdi:propane-tank
    type: sections
    max_columns: 3
    sections:
      # ------------------------------------------------------------- Tank
      - type: grid
        cards:
          - type: custom:lpg-tank-card

      # ----------------------------------------------------------- Zahlen
      - type: grid
        cards:
          - type: heading
            heading: Aktuell
            heading_style: title

          - type: entities
            entities:
              - sensor.flussiggastank_fullstand
              - sensor.flussiggastank_tankuhr
              - sensor.flussiggastank_fullung
              - sensor.flussiggastank_restenergie
              - sensor.flussiggastank_restwert
              - type: divider
              - entity: number.flussiggastank_gaspreis
                name: Gaspreis (EUR/L)
              - sensor.flussiggastank_gaspreis
              - type: divider
              - sensor.flussiggastank_tagesverbrauch
              - sensor.flussiggastank_verbrauch_seit_betankung
              - sensor.flussiggastank_letzte_betankung

          - type: heading
            heading: Prognose
            heading_style: title

          - type: entities
            entities:
              - sensor.flussiggastank_reichweite
              - sensor.flussiggastank_leer_am
              - sensor.flussiggastank_reserve_erreicht_am
              - sensor.flussiggastank_bestellen_bis
              - sensor.flussiggastank_jahresverbrauch

          - type: gauge
            entity: sensor.flussiggastank_fullung
            name: Restfüllung
            min: 0
            max: 100
            needle: true
            severity:
              green: 30
              yellow: 15
              red: 0

      # ---------------------------------------------------------- Verlauf
      - type: grid
        cards:
          - type: heading
            heading: Verlauf
            heading_style: title

          - type: history-graph
            hours_to_show: 8760
            entities:
              - entity: sensor.flussiggastank_fullstand
                name: Füllstand

          - type: statistics-graph
            title: Gasverbrauch je Monat
            chart_type: bar
            period: month
            days_to_show: 1095
            stat_types:
              - change
            entities:
              # hier deine eigenen Gasverbrauchs-Sensoren eintragen
              - sensor.e3_vitodens_200_0821_heizgasverbrauch_dieses_jahr
              - sensor.e3_vitodens_200_0821_warmwasser_gasverbrauch_dieses_jahr

          - type: statistics-graph
            title: Preisentwicklung
            chart_type: line
            period: month
            days_to_show: 1825
            stat_types:
              - mean
            entities:
              - sensor.flussiggastank_gaspreis

          - type: markdown
            title: Monatsprofil
            content: >-
              Grundlage der Prognose: der gemessene Verbrauch je Kalendermonat.


              {% set a = state_attr('sensor.flussiggastank_jahresverbrauch',
                 'monatsprofil') %}
              {% set j = state_attr('sensor.flussiggastank_jahresverbrauch',
                 'gemessene_jahre') %}
              {% if a %}
              | Monat | Liter | Anteil | Jahre |
              |---|---:|---:|---:|
              {% for monat, liter in a.items() -%}
              | {{ monat }} | {{ liter | round(0) }}
              | {{ (liter / (a.values() | sum) * 100) | round(1) }} %
              | {{ j[monat] if j else 0 }} |
              {% endfor -%}
              | **Jahr** | **{{ a.values() | sum | round(0) }}** | | |
              {% endif %}


              Spalte „Jahre" = aus wie vielen Jahren der Monat gemittelt ist.
              **0** bedeutet: noch keine Messwerte, aus der Standard-Heizkurve
              hochgerechnet.
